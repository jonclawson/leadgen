name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Type "leadgen" to confirm infrastructure destruction'
        required: true
        type: string

jobs:
  destroy:
    if: github.event.inputs.destroy != ''
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.destroy }}" != "leadgen" ]; then
            echo "❌ Confirmation did not match. Type exactly 'leadgen' to confirm."
            exit 1
          fi
          echo "✅ Destruction confirmed"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Destroy D1 Database
        working-directory: ./
        run: |
          echo "Deleting D1 Database..."
          npx wrangler d1 delete ${{ secrets.PAGES_PROJECT_NAME }} --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Destroy R2 Bucket
        working-directory: ./
        run: |
          echo "Deleting R2 Production Bucket..."
          npx wrangler r2 bucket lifecycle add ${{ secrets.PAGES_PROJECT_NAME }} --name expire --prefix "" --expire-days 0 --env production --y
          npx wrangler r2 bucket delete ${{ secrets.PAGES_PROJECT_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Destroy Cloudflare Pages Project
        working-directory: ./
        run: |
          echo "Deleting Pages Project..."
          npx wrangler pages project delete ${{ secrets.PAGES_PROJECT_NAME }} --y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}