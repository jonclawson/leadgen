name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert Pages Project Name Secret is Set
        run: |
          if [ -z "${{ secrets.PAGES_PROJECT_NAME }}" ]; then
            echo "::error::The PAGES_PROJECT_NAME GitHub secret is missing or empty. Please configure it in your repository settings."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ./
        run: npm ci

      # - name: Lint
        # working-directory: ./
        # run: npm run lint

      # - name: Test
      #   working-directory: ./
      #   run: npm run test

      - name: Configure Prisma for Cloudflare
        run: |
          sed -i 's/\/\/ runtime  = "cloudflare"/runtime  = "cloudflare"/' prisma/schema.prisma
          npx prisma generate

      - name: Build
        working-directory: ./
        run: npm run build:cf
        env:
          VITE_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Create D1 Database
        id: cloudflare_db
        working-directory: ./
        run: |
          # 1. Fetch the list of existing databases
          DB_LIST=$(npx wrangler d1 list --json)
          
          # 2. Safely read the GitHub secret via a shell env variable inside Node
          DB_ID=$(echo "$DB_LIST" | TARGET_DB="${{ secrets.PAGES_PROJECT_NAME }}" node -e '
            const fs = require("fs");
            const databases = JSON.parse(fs.readFileSync(0, "utf-8"));
            const target = process.env.TARGET_DB;
            
            const existing = databases.find(db => db.name === target);
            
            if (existing) {
              console.log(existing.uuid);
            } else {
              console.log("");
            }
          ')

          # 3. Create the database using the secret if it wasn't found
          if [ -z "$DB_ID" ]; then
            echo "Database '${{ secrets.PAGES_PROJECT_NAME }}' not found. Creating it now..."
            CREATE_OUTPUT=$(npx wrangler d1 create "${{ secrets.PAGES_PROJECT_NAME }}" --env production)
            echo "$CREATE_OUTPUT"
            
            DB_ID=$(echo "$CREATE_OUTPUT" | grep -oE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1)
          else
            echo "Found existing database named '${{ secrets.PAGES_PROJECT_NAME }}'."
          fi

          if [ -z "$DB_ID" ]; then
            echo "Error: Failed to resolve a database_id."
            exit 1
          fi
          
          echo "Successfully targeted database ID: $DB_ID"
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure R2 Bucket Exists
        working-directory: ./
        run: |
          echo "Checking for existing R2 bucket..."
          
          # 1. Run the standard list command and search for your specific bucket name
          # Using -F makes grep treat the string as a literal match, and -q makes it quiet/silent.
          if npx wrangler r2 bucket list | grep -Fq "${{ secrets.PAGES_PROJECT_NAME }}"; then
            echo "R2 Bucket '${{ secrets.PAGES_PROJECT_NAME }}' already exists. Skipping creation."
          else
            echo "R2 Bucket '${{ secrets.PAGES_PROJECT_NAME }}' not found. Creating it now..."
            npx wrangler r2 bucket create "${{ secrets.PAGES_PROJECT_NAME }}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Pages Project Exists
        working-directory: ./
        run: |
          echo "Checking for existing Pages project named '${{ secrets.PAGES_PROJECT_NAME }}'..."
          
          echo "Checking for existing Pages project named '${{ secrets.PAGES_PROJECT_NAME }}'..."
          
          # 1. Run the standard list command and check if the name is found in the output.
          # -F treats it as a fixed string, -w ensures it matches the exact project name word.
          if npx wrangler pages project list | grep -Fw "${{ secrets.PAGES_PROJECT_NAME }}"; then
            echo "Pages project '${{ secrets.PAGES_PROJECT_NAME }}' already exists. Skipping creation."
          else
            echo "Pages project '${{ secrets.PAGES_PROJECT_NAME }}' not found. Creating it now..."
            npx wrangler pages project create "${{ secrets.PAGES_PROJECT_NAME }}" --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name:  Deploy
        working-directory: ./
        run: |
          # Parse and overwrite wrangler.json using an inline Node script
          node -e '
            const fs = require("fs");
            const file = "wrangler.json";
            const rawData = fs.readFileSync(file, "utf8");
            
            // Strip comments to safely parse JSONC
            // const cleanJson = rawData.replace(/\/\*[\s\S]*?\*\/|([^\\:]|^)\/\/.*$/gm, "$1");
            // Using JSON
            const config = JSON.parse(rawData);
            
            // Inject the new Database ID from the step environment
            config.env.production.d1_databases[0].database_id = process.env.DB_ID;
            config.env.production.d1_databases[0].database_name = process.env.PAGES_PROJECT_NAME;

            config.env.production.r2_buckets[0].bucket_name = process.env.PAGES_PROJECT_NAME;
            
            // Inject the missing production secrets/vars
            config.env.production.vars.BETTER_AUTH_URL = process.env.BETTER_AUTH_URL;
            
            // Write back standard clean JSON
            fs.writeFileSync(file, JSON.stringify(config, null, 2), "utf8");
            console.log("wrangler.json successfully updated.");
          '
          
          # Run database migrations and deploy application
          npx wrangler d1 migrations apply ${{ secrets.PAGES_PROJECT_NAME }} --remote --env production
          npx wrangler pages deploy --project-name=${{ secrets.PAGES_PROJECT_NAME }}

          # Securely pipe secrets directly into the Cloudflare Secrets Manager
          echo "${{ secrets.BETTER_AUTH_SECRET }}" | npx wrangler pages secret put BETTER_AUTH_SECRET --project-name="${{ secrets.PAGES_PROJECT_NAME }}"
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler pages secret put STRIPE_SECRET_KEY --project-name="${{ secrets.PAGES_PROJECT_NAME }}"
          echo "${{ secrets.STRIPE_PRICE_ID }}" | npx wrangler pages secret put STRIPE_PRICE_ID --project-name="${{ secrets.PAGES_PROJECT_NAME }}"
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name="${{ secrets.PAGES_PROJECT_NAME }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ env.DB_ID }} 
          PAGES_PROJECT_NAME: ${{ secrets.PAGES_PROJECT_NAME }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}



